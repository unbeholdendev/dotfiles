onboarding = false

[theme]
name = "gruvbox"

[ui]
# The colour noctalia paints the niri focus ring, so a pane matches a window.
accent = "#b8bb26"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_workspace_name = true
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false
