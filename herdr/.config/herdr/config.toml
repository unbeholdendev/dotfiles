# The desktop themes foot from the noctalia palette, so follow the terminal
# rather than keep a second palette in step with it.
[theme]
name = "terminal"

[ui]
# The default accent is cyan, which clashes with the gruvbox palette foot
# carries. This is bright4 in that palette.
accent = "#83a598"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_workspace_name = true
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "terminal"

# The client runs on a headless host, so there is no audio device.
[ui.sound]
enabled = false
