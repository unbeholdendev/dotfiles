config_version = 8

[bar.default]

[widget.clock]
format = "{:%a %d %b  %H:%M}"

[battery]
warning_threshold = 15

[brightness]
enable_ddcutil = true

[nightlight]
enabled = true
temperature_night = 3500

[calendar]
enabled = true

    [calendar.account.radicale]
    provider = "custom"
    server_url = "https://cal.home.unbeholden.dev"
    type = "caldav"
    username = "fam"

[idle]
pre_action_fade_seconds = 3.0

    [idle.behavior.lock]
    enabled = true
    timeout = 300
    action = "lock"

    [idle.behavior.screen-off]
    enabled = true
    timeout = 360
    action = "screen_off"

    [idle.behavior.suspend]
    enabled = true
    timeout = 600
    action = "lock_and_suspend"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Gruvbox"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "niri" ]
    community_ids = [ "zathura", "yazi" ]

[wallpaper]
directory = "/home/pycan/Pictures/Wallpapers"
directory_dark = "/home/pycan/Pictures/Wallpapers"
directory_light = "/home/pycan/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.last]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.monitors.DP-1]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

[location]
latitude = 49.724891
longitude = 18.466191
