config_version = 13

[backdrop]
enabled = true

[bar.default]
end = [
    "media",
    "recorder",
    "privacy",
    "cpu",
    "ram",
    "keyboard_layout",
    "power_profile",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
start = [ "workspaces", "active_window" ]

    [bar.default.monitor."eDP-1"]
    margin_ends = 0

[battery]
warning_threshold = 15

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.radicale]
    provider = "custom"
    server_url = "https://cal.home.unbeholden.dev"
    type = "caldav"
    username = "fam"

[control_center.calendar]
show_week_numbers = true

[hot_corners]
delay_ms = 120
enabled = true

    [hot_corners.top_left]
    action = "overview"

[idle]
pre_action_fade_seconds = 3.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360

    [idle.behavior.suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600

[location]
auto_locate = true
latitude = 49.724891
longitude = 18.466190999999998

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_night = 3500

[notification]
history_retention_hours = 168
monitors = [ "DP-1" ]

[plugin_settings."noctalia/screen_recorder"]
audio_source = "none"
color_range = "full"
glyph_recording = "video-filled"
hide_inactive = true
video_qp = 20

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
date_format = "%A, %d %B"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.screen_corners]
    enabled = true
    size = 12

[theme]
builtin = "Gruvbox"

    [theme.templates]
    builtin_ids = [ "foot", "niri", "gtk3", "gtk4", "qt", "btop" ]
    community_ids = [ "zathura", "yazi" ]

[wallpaper]
directory = "/home/pycan/Pictures/Wallpapers"
directory_dark = "/home/pycan/Pictures/Wallpapers"
directory_light = "/home/pycan/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.last]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.monitors.DP-1]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/pycan/Pictures/Wallpapers/8207827.png"

[widget.clock]
font_family = "JetBrains Mono"
format = "{:%a %d %b  %H:%M}"
tooltip_format = "{:%A %d %B %Y (week %V)}"

[widget.privacy]
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"