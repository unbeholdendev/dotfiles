# The DisplayPort outputs of the internal card come with a session priority of
# 500 against 100 for the analog output, so they take the default sink when the
# monitor connects. The monitor has no speakers.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI.*__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
