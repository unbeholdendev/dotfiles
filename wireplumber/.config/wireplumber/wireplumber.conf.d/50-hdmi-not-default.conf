# The DisplayPort outputs of the internal card come with a session priority of
# 500 against 100 for the speaker and 200 for the headphones, so they take the
# default sink when the monitor connects. The monitor has no speakers. 50 stays
# below both analog outputs, so it is never a tie.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI.*__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 50
      }
    }
  }
]
